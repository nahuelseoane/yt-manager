name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      # Tests use fakes: no secrets, no network calls to YouTube or the TV.
      - name: Run tests
        run: .venv/bin/pytest
