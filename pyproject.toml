[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-manager"
version = "0.1.0"
description = "Manage your YouTube playlists from the command line with the YouTube Data API v3."
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ytm = "ytmanager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
